output_dir: output/

dataset:
  class: JointDataset
  graphs: [FB15k237, WN18RR, CoDExMedium]
  root: kg-datasets/

model:
  class: MERIT
  relation_model:
    class: RelTransformerMERIT
    input_dim: 64
    hidden_dims: [64, 64, 64, 64, 64, 64]
    num_heads: 8
    ff_dim: 256
    dropout: 0.0
    rni: yes
    num_channels: 4
    attn_impl: mha
    role_features: max,logdeg
    role_dim: 8
  entity_model:
    class: IndNBFNet
    input_dim: 64
    hidden_dims: [64, 64, 64, 64, 64, 64]
    message_func: distmult
    aggregate_func: sum
    short_cut: yes
    layer_norm: yes

task:
  name: MultiGraphPretraining
  num_negative: 512
  strict_negative: yes
  adversarial_temperature: 1
  metric: [mr, mrr, hits@1, hits@3, hits@10]

optimizer:
  class: AdamW
  lr: 5.0e-4

train:
  gpus: {{ gpus }}
  batch_size: 64
  num_epoch: 10
  log_interval: 800
  batch_per_epoch: 30000
